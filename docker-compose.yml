services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - lab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Compose 网络内数据库主机名为 db
      DATABASE_URL: postgresql://lab:lab@db:5432/lab
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "10"
      DB_ACQUIRE_TIMEOUT: "10"
      TX_MAX_RETRIES: "5"
    ports:
      - "8000:8000"

volumes:
  lab_pgdata:
